[project]
name = "hedwig"
version = "0.1.0"
description = "Hybrid Evolving Digital Wisdom & Intelligence Guardian"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amaan Khan" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[project.scripts]
hedwig = "hedwig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedwig"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting (replaces black + flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Documentation is prose. A code formatter must never rewrite a design document —
# ruff formats Python blocks inside Markdown, and docs/ contains illustrative contracts.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtin shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes — see docs/03 §5.6
    "T20",         # no print() in library code
    "SIM",         # simplify
    "PTH",         # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"src/hedwig/cli.py" = ["T20"]           # the CLI is allowed to write to stdout
"src/hedwig/core/clock.py" = ["DTZ005"] # the one sanctioned caller of datetime.now
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["hedwig"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict on the platform layer, which everything else depends on
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/hedwig", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "architecture: enforces the rules in docs/ (layering, conventions)",
]

[tool.coverage.run]
source = ["src/hedwig"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
]
